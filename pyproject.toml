[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"SAP-Role-Updater.py" = ["I001"]
"main.py" = ["E402"]
"scripts/smoke_test.py" = ["E402"]
"src/sap_role_updater/gui/theme.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
